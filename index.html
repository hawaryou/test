<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06152b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EuroMed">
<title>EuroMed — Hub Technicien</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=20261029-demo-checkup">
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Passer en mode clair" aria-pressed="false"><span aria-hidden="true">☀️</span><span id="themeToggleLabel">Mode clair</span></button>
<script>
(function(){
 var root=document.documentElement,key='euromed-maintenance-theme',button=document.getElementById('themeToggle'),label=document.getElementById('themeToggleLabel');
 function apply(theme){theme=theme==='light'?'light':'dark';root.setAttribute('data-theme',theme);if(button){button.setAttribute('aria-pressed',String(theme==='light'));button.setAttribute('aria-label',theme==='dark'?'Passer en mode clair':'Passer en mode sombre');}if(label){label.textContent=theme==='dark'?'Mode clair':'Mode sombre';}var icon=button&&button.querySelector('[aria-hidden="true"]');if(icon)icon.textContent=theme==='dark'?'☀️':'🌙';}
 var saved=null;try{saved=localStorage.getItem(key)}catch(e){}apply(saved==='light'?'light':'dark');
 if(button)button.addEventListener('click',function(){var next=root.getAttribute('data-theme')==='dark'?'light':'dark';apply(next);try{localStorage.setItem(key,next)}catch(e){}});
})();
</script>
<div class="app-shell">
  <main id="app" class="app-content"></main>
  <nav class="bottom-nav" aria-label="Navigation principale">
    <button class="nav-item active" data-page="home" type="button"><span class="nav-icon">⌂</span><span>Accueil</span></button>
    <button class="nav-item" data-page="maintenance" type="button"><span class="nav-icon">⚙</span><span>Maintenance</span></button>
    <button class="nav-item" data-page="tools" type="button"><span class="nav-icon">☷</span><span>Outils</span></button>
    <button class="nav-item" data-page="documentation" type="button"><span class="nav-icon">▤</span><span>Documentation</span></button>
  </nav>
</div>
<script>
const MAINTENANCE = [
  {id:'lit', title:'Lit médicalisé', short:'Lit médicalisé', subtitle:'Vérifiez, contrôlez et assurez le bon fonctionnement de votre lit médicalisé.', url:'https://hawaryou.github.io/maintenance-lit-medical/', cls:'purple', icon:'🛏️'},
  {id:'fauteuil', title:'Fauteuil roulant', short:'Fauteuil roulant', subtitle:'Assurez la sécurité et la performance de votre fauteuil roulant.', url:'https://hawaryou.github.io/maintenance-fauteuil-roulant/', cls:'green', icon:'♿'},
  {id:'matelas', title:'Matelas à air', short:'Matelas à air', subtitle:'Contrôlez le système alternating et son bon fonctionnement.', url:'https://hawaryou.github.io/maintenance-matelas-alternating/', cls:'blue', icon:'🛌'},
  {id:'leve', title:'Lève-personne', short:'Lève-personne', subtitle:'Contrôlez le matériel de transfert et ses éléments de sécurité.', url:'https://hawaryou.github.io/maintenance-leve-personne/', cls:'orange', icon:'🏥'},
  {id:'verticalisateur', title:'Verticalisateur', short:'Verticalisateur', subtitle:'Vérifiez, contrôlez et assurez le bon fonctionnement de votre verticalisateur.', url:'https://hawaryou.github.io/maintenance-verticalisateur/', cls:'pink', icon:'🧍'}
];
const app=document.getElementById('app');
const navItems=[...document.querySelectorAll('.nav-item')];
const logo=()=>`<img class="logo" src="euromed-logo.png" alt="EuroMed">`;
const arrow=()=>'<span class="arrow">›</span>';
function setNav(page){navItems.forEach(x=>x.classList.toggle('active',x.dataset.page===page));}
function showPage(page){setNav(page);window.scrollTo({top:0,behavior:'smooth'}); if(page==='maintenance')maintenancePage(); else if(page==='documentation')documentationPage(); else if(page==='tools')toolsPage(); else if(page==='checkupTruck')checkupTruckPage(); else if(page==='checkupParts')checkupPartsPage(); else home();}
function quickIcon(kind){return kind==='delivery'?'🚚':'📦'}
function home(){
 app.innerHTML=`
 <section class="screen-home">
   <div class="topbar">
     <div class="brand-box">${logo()}</div>
     <div class="status-pill" id="connectivityStatus" role="status" aria-live="polite"><span></span><span id="connectivityLabel">Connexion…</span></div>
   </div>
   <div class="hero-card">
     <div class="hero-glow one"></div><div class="hero-glow two"></div>
     <div class="hero-copy">
       <span class="mini-label">HUB TECHNICIEN</span>
       <h1>Bonjour 👋<br><strong>Prêt pour l'intervention ?</strong></h1>
       <p>Tous vos outils EuroMed réunis dans une seule application.</p>
     </div>
     <div class="hero-mascot"><div class="mascot-ring"></div><img src="chibi-euromed.png" alt="Technicien EuroMed"></div>
   </div>
   <div class="section-head"><div><span class="section-kicker">ACCÈS RAPIDE</span><h2>Vos outils</h2></div></div>
   <div class="quick-grid">
     <a class="quick-card delivery" href="https://hawaryou.github.io/Bon-de-livraison-euromed/"><div class="quick-art">${quickIcon('delivery')}</div><div><b>Carnet de<br>livraison</b><small>Créer un bon</small></div>${arrow()}</a>
     <a class="quick-card reprise" href="https://hawaryou.github.io/bon-reprise-euromed/"><div class="quick-art">↩️</div><div><b>Carnet de<br>reprise</b><small>Reprendre du matériel</small></div>${arrow()}</a>
     <a class="quick-card inventory" href="https://hawaryou.github.io/inventaire-materiel/"><div class="quick-art">${quickIcon('inventory')}</div><div><b>Inventaire<br>matériel</b><small>Gérer le parc</small></div>${arrow()}</a>
     <a class="quick-card anomaly" href="signaler-anomalie.html"><div class="quick-art">⚠️</div><div><b>Signaler une<br>anomalie</b><small>Demander une intervention</small></div>${arrow()}</a>
   </div>

   <div class="section-head"><div><span class="section-kicker">SUIVI HEBDOMADAIRE</span><h2>Check-up hebdomadaires</h2></div></div>
   <div class="quick-grid checkup-category-grid">
     <button class="quick-card" data-page="checkupTruck" type="button" style="text-align:left;color:inherit"><div class="quick-art">🚐</div><div><b>Check-up<br>des camions</b><small>Crafter et Jumper</small></div>${arrow()}</button>
     <button class="quick-card" data-page="checkupParts" type="button" style="text-align:left;color:inherit"><div class="quick-art">🧰</div><div><b>Check-up des<br>pièces détachées</b><small>Stock dans le camion</small></div>${arrow()}</button>
   </div>
   <div class="section-head maintenance-head"><div><span class="section-kicker">CONTRÔLE & SUIVI</span><h2>Nos maintenances</h2></div><button class="view-all" data-page="maintenance">Voir tout</button></div>
   <div class="maintenance-scroller">${MAINTENANCE.map((x,i)=>`<button class="maintenance-tile ${x.cls}" data-maint="${x.id}" type="button"><div class="tile-orb">${x.icon}</div><span>${x.title}</span><small>Ouvrir la maintenance</small><i>›</i></button>`).join('')}</div>
   <div class="ready-banner"><div class="ready-icon">✓</div><div><b>Prêt pour l'intervention</b><span>Sélectionnez simplement l'outil dont vous avez besoin.</span></div></div>
 </section>`;
 app.querySelector('.view-all').addEventListener('click',()=>showPage('maintenance'));
 app.querySelectorAll('[data-maint]').forEach(b=>b.addEventListener('click',()=>{const x=MAINTENANCE.find(m=>m.id===b.dataset.maint);location.href=x.url;}));
}
function maintenancePage(){
 app.innerHTML=`
 <section class="page-top dark-top">
   <div class="topbar"><button class="back-btn" data-page="home">‹</button><div class="page-title">⚙️ <span>Maintenance</span></div><div class="top-spacer"></div></div>
   <p>Sélectionnez la maintenance souhaitée.</p>
 </section>
 <section class="maintenance-page-section">
   <div class="tab-scroller" role="tablist">${MAINTENANCE.map((x,i)=>`<button class="maint-tab ${i===0?'active':''}" data-id="${x.id}" role="tab" type="button">${x.short}</button>`).join('')}</div>
   <div id="maintenance-panel"></div>
   <div class="dots" id="dots">${MAINTENANCE.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('')}</div>
 </section>`;
 const panel=app.querySelector('#maintenance-panel');
 function select(id){const item=MAINTENANCE.find(x=>x.id===id); const idx=MAINTENANCE.indexOf(item); app.querySelectorAll('.maint-tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id)); app.querySelectorAll('.dots span').forEach((d,i)=>d.classList.toggle('active',i===idx)); panel.innerHTML=`<article class="selected-maint ${item.cls}"><div class="selected-art">${item.icon}</div><span class="selected-kicker">MAINTENANCE</span><h2>${item.title}</h2><p>${item.subtitle}</p><a class="big-open" href="${item.url}">Ouvrir la maintenance ${arrow()}</a><div class="direct-link">↗ Lien direct</div></article>`;}
 app.querySelectorAll('.maint-tab').forEach(t=>t.addEventListener('click',()=>select(t.dataset.id))); app.querySelector('.back-btn').addEventListener('click',()=>showPage('home')); select('lit');
}

function toolsPage(){
 app.innerHTML=`<section class="page-top dark-top"><div class="topbar"><button class="back-btn" data-page="home">‹</button><div class="page-title">🧰 <span>Vos outils</span></div><div class="top-spacer"></div></div><p>Tous les outils quotidiens du technicien EuroMed, réunis ici.</p></section><section class="tools-directory">
 <a class="tool-launch tool-delivery" href="https://hawaryou.github.io/Bon-de-livraison-euromed/"><span class="tool-launch-icon">🚚</span><span><b>Carnet de livraison</b><small>Créer et signer un bon de livraison</small></span><span class="tool-arrow">›</span></a>
 <a class="tool-launch tool-reprise" href="https://hawaryou.github.io/bon-reprise-euromed/"><span class="tool-launch-icon">↩️</span><span><b>Carnet de reprise</b><small>Tracer le matériel repris</small></span><span class="tool-arrow">›</span></a>
 <a class="tool-launch tool-inventory" href="https://hawaryou.github.io/inventaire-materiel/"><span class="tool-launch-icon">📦</span><span><b>Inventaire du matériel</b><small>Consulter et gérer le parc</small></span><span class="tool-arrow">›</span></a>
 <a class="tool-launch tool-anomaly" href="signaler-anomalie.html"><span class="tool-launch-icon">⚠️</span><span><b>Signaler une anomalie</b><small>Déclarer un problème technique</small></span><span class="tool-arrow">›</span></a>
 </section>`;
 app.querySelector('.back-btn').onclick=()=>showPage('home');
}
function checkupTruckPage(){renderCheckup('truck')}
function checkupPartsPage(){renderCheckup('parts')}
function renderCheckup(mode){
 const isTruck=mode==='truck';
 const veh=['État de la carrosserie','Pneus (pression et usure)','Feux (phares, arrière, clignotants, freins)','Rétroviseurs','Vitres (fissures, éclats)','Niveau d’huile','Liquide de refroidissement','Liquide de frein','Essuie-glaces et lave-glace','Tableau de bord (voyants d’alerte)','Ceintures de sécurité','Système de communication','Équipement médical','Extincteur','Hygiène et propreté','Côté droit inspecté','Côté gauche inspecté','Avant inspecté','Arrière inspecté'];
 const parts=[[1,'Gonfleur à air pour matelas Nausiflow 512'],[1,'Moteur hauteur variable LINAK'],[1,'Moteur hauteur variable DEWERT'],[1,'Moteur relève-buste LINAK'],[1,'Moteur relève-buste DEWERT'],[1,'Télécommande de lit LINAK'],[1,'Télécommande de lit DEWERT'],[4,'Roues de lit + visserie'],[2,'Barres de liaison de sommier de lit'],[6,'Papillons de lit'],[4,'Attaches barrières de lit'],[2,'Crémaillères de sommier pied pour lit'],[2,'Attaches pour sommier pied'],[1,'Boîte de masques type II'],[1,'Mousse nettoyante Hartmann'],[1,'Bouteille de gel hydroalcoolique'],[1,'Boîte de gants latex/vinyle'],[1,'Paquet de lingettes désinfectantes'],[1,'Sachet poubelle'],[1,'Blouse de protection intégrale']];
 const title=isTruck?'Check-up des camions':'Check-up des pièces détachées';
 const subtitle=isTruck?'Contrôle extérieur, mécanique et équipements du Crafter ou du Jumper.':'Inventaire hebdomadaire des pièces détachées et consommables présents dans le camion.';
 const key='euromed-weekly-checkups-'+mode;
 const fields=isTruck?veh.map((x,i)=>`<div class="cu-row"><label class="cu-item"><span>${x}</span><select name="veh_${i}" aria-label="${x}"><option value="">À vérifier</option><option>OK</option><option>Problème</option><option>Sans objet</option></select></label><input class="cu-detail" name="veh_note_${i}" placeholder="Détail / action à prévoir"></div>`).join(''):parts.map((p,i)=>`<div class="cu-row"><div class="part-name"><b>${p[0]}×</b><span>${p[1]}</span></div><label class="part-check"><input type="checkbox" name="part_present_${i}"> Présent</label><label class="part-check"><input type="checkbox" name="part_missing_${i}"> Manquant</label><input class="cu-detail" name="part_note_${i}" placeholder="Quantité constatée / remarque"></div>`).join('');
 app.innerHTML=`<section class="page-top dark-top"><div class="topbar"><button class="back-btn" data-page="home">‹</button><div class="page-title">${isTruck?'🚐':'🧰'} <span>${title}</span></div><div class="top-spacer"></div></div><p>${subtitle}</p></section><section class="checkup-wrap"><div class="checkup-note">Contrôle hebdomadaire de démonstration. Les données sont conservées localement sur cet appareil ; imprimez le formulaire signé pour l’archivage.</div><form id="checkupForm"><section class="checkup-section"><h2>1. Identification</h2><div class="checkup-fields"><label>Véhicule<select id="cuVehicle" required><option>Volkswagen Crafter</option><option>Citroën Jumper</option></select></label><label>Date<input id="cuDate" type="date" required></label><label>Nom du technicien<input id="cuTech" required placeholder="Nom et prénom"></label>${isTruck?'<label>Kilométrage<input id="cuKm" type="number" min="0" placeholder="Kilométrage"></label>':''}</div></section><section class="checkup-section"><h2>2. ${isTruck?'Vérification du camion':'Pièces détachées à bord'}</h2><p class="checkup-sub">${isTruck?'Inspectez chaque zone du véhicule puis sélectionnez l’état de chaque élément.':'Vérifiez la présence des quantités attendues et signalez les éléments manquants.'}</p>${isTruck?`<div class="vehicle-views"><div class="vehicle-view view-side"><div class="van-drawing"><span class="van-cab"></span><span class="van-body"></span><i class="wheel w1"></i><i class="wheel w2"></i></div><b>Côté droit</b><small>Carrosserie, portes, pneus</small></div><div class="vehicle-view view-side"><div class="van-drawing reverse"><span class="van-cab"></span><span class="van-body"></span><i class="wheel w1"></i><i class="wheel w2"></i></div><b>Côté gauche</b><small>Carrosserie, portes, pneus</small></div><div class="vehicle-view view-front"><div class="van-front"><i></i><i></i><span></span></div><b>Avant</b><small>Capot, pare-brise, feux</small></div><div class="vehicle-view view-rear"><div class="van-rear"><i></i><span></span><i></i></div><b>Arrière</b><small>Portes, feux, pare-chocs</small></div></div>`:''}<div class="checkup-progress"><span id="cuProgressText">0 élément vérifié</span><div><i id="cuProgressBar"></i></div></div><div class="checkup-list">${fields}</div></section><section class="checkup-section"><h2>3. Observations et signature</h2><label class="full-label">Observations générales<textarea id="cuNotes" rows="3" placeholder="Anomalies, pièces à commander, actions réalisées…"></textarea></label><label class="full-label">Signature du technicien</label><canvas id="cuSignature"></canvas><button class="secondary-btn" id="clearSig" type="button">Effacer la signature</button></section><div class="checkup-actions"><button class="big-open" type="submit">💾 Enregistrer le contrôle</button><button class="secondary-btn" id="printCu" type="button">🖨️ Imprimer / PDF</button><button class="secondary-btn" id="newCu" type="button">Nouveau contrôle</button></div></form><section class="checkup-section"><h2>Historique de ce check-up</h2><div id="cuHistory"></div></section></section>`;
 app.querySelector('.back-btn').onclick=()=>showPage('home');const date=app.querySelector('#cuDate');date.value=new Date().toISOString().slice(0,10);const canvas=app.querySelector('#cuSignature'),ctx=canvas.getContext('2d');let drawing=false,ink=false;
 function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.max(300,Math.floor(r.width*devicePixelRatio));canvas.height=150*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#10243b'}resize();
 function pt(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{drawing=true;ink=true;canvas.setPointerCapture(e.pointerId);const p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};canvas.onpointermove=e=>{if(drawing){const p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke()}};['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,()=>drawing=false));app.querySelector('#clearSig').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ink=false};
 function updateProgress(){const controls=[...app.querySelectorAll('.checkup-list select')];const done=controls.filter(x=>x.value!=='').length;const total=controls.length;const label=app.querySelector('#cuProgressText');const bar=app.querySelector('#cuProgressBar');if(label)label.textContent=done+' / '+total+' éléments vérifiés';if(bar)bar.style.width=(total?done/total*100:0)+'%';controls.forEach(x=>{x.closest('.cu-row')?.classList.toggle('cu-problem',x.value==='Problème');x.closest('.cu-row')?.classList.toggle('cu-ok',x.value==='OK')})}app.querySelectorAll('.checkup-list select').forEach(x=>x.addEventListener('change',updateProgress));updateProgress();
 function history(){let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}app.querySelector('#cuHistory').innerHTML=a.length?a.slice().reverse().map(x=>`<div class="cu-history-row"><b>${x.vehicle} — ${x.date}</b><span>${x.tech} · ${x.status}</span></div>`).join(''):'<p class="checkup-sub">Aucun contrôle enregistré sur cet appareil.</p>'}
 app.querySelector('#checkupForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget;const data={vehicle:app.querySelector('#cuVehicle').value,date:date.value,tech:app.querySelector('#cuTech').value,km:app.querySelector('#cuKm')?.value||'',notes:app.querySelector('#cuNotes').value,signature:ink?canvas.toDataURL('image/png'):'',fields:{},status:'Contrôle enregistré'};form.querySelectorAll('[name]').forEach(el=>data.fields[el.name]=el.type==='checkbox'?el.checked:el.value);let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}a.push(data);try{localStorage.setItem(key,JSON.stringify(a));alert('Contrôle enregistré sur cet appareil. Pensez à imprimer une copie pour l’archivage.');history()}catch(err){alert('Stockage local saturé. Imprimez le contrôle pour le conserver.')}};
 app.querySelector('#printCu').onclick=()=>window.print();app.querySelector('#newCu').onclick=()=>{if(confirm('Commencer un nouveau contrôle ?')){if(isTruck)checkupTruckPage();else checkupPartsPage()}};history();
}

function documentationPage(){
 app.innerHTML=`
 <section class="page-top dark-top doc-top">
   <div class="topbar"><button class="back-btn" data-page="home">‹</button><div class="page-title">📄 <span>Documentation</span></div><div class="top-spacer"></div></div>
   <p>Accédez à vos documents et notices EuroMed.</p>
 </section>
 <section class="documentation-wrap">
   <div class="doc-card"><div class="doc-art">📄<span>PDF</span></div><span class="selected-kicker">DOCUMENTS EUROMED</span><h2>Envoi PDF EuroMed</h2><p>Accédez à la documentation, aux notices et envoyez vos documents.</p><a class="big-open" href="https://hawaryou.github.io/envoi_pdf_euromed/">Ouvrir la documentation ${arrow()}</a><div class="direct-link">↗ https://hawaryou.github.io/envoi_pdf_euromed/</div></div>
   <div class="doc-mascot"><div>Ensemble pour<br><strong>votre matériel !</strong></div><img src="chibi-euromed.png" alt="EuroMed"></div>
 </section>`;
 app.querySelector('.back-btn').addEventListener('click',()=>showPage('home'));
}
navItems.forEach(item=>item.addEventListener('click',()=>showPage(item.dataset.page)));
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b&&b.classList.contains('view-all'))showPage(b.dataset.page);});
home();
</script>
<script>
(function(){
 function update(){var pill=document.getElementById("connectivityStatus"),label=document.getElementById("connectivityLabel");if(!pill||!label)return;var online=navigator.onLine;label.textContent=online?"EN LIGNE":"HORS CONNEXION";pill.classList.toggle("offline",!online);pill.setAttribute("aria-label",online?"Connexion disponible":"Mode hors connexion");}
 window.addEventListener("online",update);window.addEventListener("offline",update);update();
 if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("./service-worker.js").catch(function(e){console.warn("Mode hors connexion indisponible",e);});}
})();
</script>
</body>
</html>
