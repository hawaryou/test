<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06152b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EuroMed">
<title>EuroMed — Hub Technicien</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <main id="app" class="app-content"></main>
  <nav class="bottom-nav" aria-label="Navigation principale">
    <button class="nav-item active" data-page="home" type="button"><span class="nav-icon">⌂</span><span>Accueil</span></button>
    <button class="nav-item" data-page="tools" type="button"><span class="nav-icon">🧰</span><span>Outils</span></button>
    <button class="nav-item" data-page="maintenance" type="button"><span class="nav-icon">⚙</span><span>Maintenance</span></button>
    <button class="nav-item" data-page="documentation" type="button"><span class="nav-icon">▤</span><span>Docs</span></button>
    <button class="nav-item" data-page="profile" type="button"><span class="nav-icon">●</span><span>Profil</span></button>
  </nav>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
const MAINTENANCE = [
 {id:'lit',title:'Lit médicalisé',subtitle:'Vérifiez, contrôlez et assurez le bon fonctionnement de votre lit médicalisé.',url:'https://hawaryou.github.io/maintenance-lit-medical/',cls:'purple',icon:'🛏️'},
 {id:'fauteuil',title:'Fauteuil roulant',subtitle:'Assurez la sécurité et la performance de votre fauteuil roulant.',url:'https://hawaryou.github.io/maintenance-fauteuil-roulant/',cls:'green',icon:'♿'},
 {id:'matelas',title:'Matelas à air',subtitle:'Contrôlez le système alternating et son bon fonctionnement.',url:'https://hawaryou.github.io/maintenance-matelas-alternating/',cls:'blue',icon:'🛌'},
 {id:'leve',title:'Lève-personne',subtitle:'Contrôlez le matériel de transfert et ses éléments de sécurité.',url:'https://hawaryou.github.io/maintenance-leve-personne/',cls:'orange',icon:'🏥'},
 {id:'verticalisateur',title:'Verticalisateur',subtitle:'Vérifiez, contrôlez et assurez le bon fonctionnement de votre verticalisateur.',url:'https://hawaryou.github.io/maintenance-verticalisateur/',cls:'pink',icon:'🧍'},
 {id:'chaise',title:'Chaise de douche',subtitle:'Contrôlez la stabilité, les freins et les éléments de sécurité.',url:'#',cls:'cyan',icon:'🚿'},
 {id:'fauteuil-electrique',title:'Fauteuil électrique',subtitle:'Contrôlez commandes, batteries, freins et sécurité.',url:'#',cls:'violet',icon:'🦽'},
 {id:'chargeur',title:'Batteries & chargeurs',subtitle:'Vérifiez l’état, la charge et les connexions.',url:'#',cls:'yellow',icon:'🔋'}
];
const app=document.getElementById('app'), toast=document.getElementById('toast');
const navItems=[...document.querySelectorAll('.nav-item')];
const logo=()=>`<img class="logo" src="assets/euromed-logo.png" alt="EuroMed">`;
const arrow=()=>'<span class="arrow">›</span>';
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),2600)}
function setNav(page){navItems.forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function showPage(page){setNav(page);window.scrollTo({top:0,behavior:'smooth'});({home,tools,maintenancePage,documentationPage,profile,interventions,equipment,anomaly,stats,alerts,scanner,interventionWizard}[page]||home)()}
function shellTop(title,sub,back='home',icon=''){return `<section class="page-top"><div class="topbar"><button class="back-btn" data-page="${back}">‹</button><div class="page-title">${icon}<span>${title}</span></div><button class="icon-btn" data-page="alerts" aria-label="Alertes">🔔<i>3</i></button></div><p>${sub}</p></section>`}
function home(){
 app.innerHTML=`<section class="screen-home">
  <div class="topbar"><div class="brand-box">${logo()}</div><button class="status-pill" data-page="profile"><span></span> EN LIGNE</button></div>
  <div class="hero-card"><div class="hero-glow one"></div><div class="hero-glow two"></div><div class="hero-copy"><span class="mini-label">HUB TECHNICIEN</span><h1>Bonjour 👋<br><strong>Prêt pour l'intervention ?</strong></h1><p>Tous vos outils EuroMed réunis dans une seule application.</p><button class="primary-btn" data-page="interventionWizard">🚀 Démarrer une intervention</button></div><div class="hero-mascot"><div class="mascot-ring"></div><img src="assets/chibi-euromed.png" alt="Technicien EuroMed"></div></div>
  <div class="section-head"><div><span class="section-kicker">ACCÈS RAPIDE</span><h2>Vos outils</h2></div><button class="view-all" data-page="tools">Tout voir</button></div>
  <div class="quick-grid">
   <a class="quick-card delivery" href="https://hawaryou.github.io/Bon-de-livraison-euromed/"><div class="quick-art">🚚</div><div><b>Carnet de<br>livraison</b><small>Créer un bon</small></div>${arrow()}</a>
   <a class="quick-card reprise" href="https://hawaryou.github.io/bon-reprise-euromed/"><div class="quick-art">↩️</div><div><b>Carnet de<br>reprise</b><small>Reprendre du matériel</small></div>${arrow()}</a>
   <a class="quick-card inventory" href="https://hawaryou.github.io/inventaire-materiel/"><div class="quick-art">📦</div><div><b>Inventaire<br>matériel</b><small>Gérer le parc</small></div>${arrow()}</a>
   <button class="quick-card anomaly" data-page="anomaly"><div class="quick-art">⚠️</div><div><b>Signaler une<br>anomalie</b><small>Photo & rapport</small></div>${arrow()}</button>
  </div>
  <div class="section-head maintenance-head"><div><span class="section-kicker">CONTRÔLE & SUIVI</span><h2>Nos maintenances</h2></div><button class="view-all" data-page="maintenance">Voir tout</button></div>
  <div class="maintenance-scroller">${MAINTENANCE.slice(0,5).map(x=>`<button class="maintenance-tile ${x.cls}" data-maint="${x.id}" type="button"><div class="tile-orb">${x.icon}</div><span>${x.title}</span><small>Ouvrir la maintenance</small><i>›</i></button>`).join('')}</div>
  <div class="dashboard-row"><button class="mini-panel" data-page="interventions"><strong>🧑‍🔧 Mes interventions</strong><span>4 aujourd’hui</span><b>Voir</b></button><button class="mini-panel" data-page="stats"><strong>📊 Mon activité</strong><span>24 interventions</span><b>Stats</b></button></div>
  <div class="ready-banner"><div class="ready-icon">✓</div><div><b>Prêt pour l'intervention</b><span>Sélectionnez simplement l'outil dont vous avez besoin.</span></div></div>
 </section>`;
 bind();
}
function tools(){app.innerHTML=`${shellTop('Outils technicien','Les fonctions utiles au quotidien.')}<section class="tools-wrap"><button class="tool-card blue" data-page="scanner"><span>📷</span><div><b>Scanner QR / code-barres</b><small>Identifier rapidement un équipement</small></div>${arrow()}</button><button class="tool-card purple" data-page="interventionWizard"><span>🚀</span><div><b>Mode intervention</b><small>Guidé de l’identification à la signature</small></div>${arrow()}</button><button class="tool-card orange" data-page="anomaly"><span>⚠️</span><div><b>Signaler une anomalie</b><small>Décrire, photographier et transmettre</small></div>${arrow()}</button><button class="tool-card green" data-page="interventions"><span>🧑‍🔧</span><div><b>Mes interventions</b><small>Suivre les opérations du jour</small></div>${arrow()}</button><button class="tool-card cyan" data-page="equipment"><span>📦</span><div><b>Gestion du matériel</b><small>Parc, entrées, sorties et transferts</small></div>${arrow()}</button><button class="tool-card pink" data-page="stats"><span>📊</span><div><b>Statistiques</b><small>Votre activité et vos indicateurs</small></div>${arrow()}</button><button class="tool-card yellow" data-page="alerts"><span>🔔</span><div><b>Alertes</b><small>Maintenances et informations importantes</small></div>${arrow()}</button></section>`;bind()}
function maintenancePage(){app.innerHTML=`${shellTop('Maintenance','Choisissez le matériel à contrôler.')}<section class="maintenance-page-section"><div class="tab-scroller" role="tablist">${MAINTENANCE.map((x,i)=>`<button class="maint-tab ${i===0?'active':''}" data-id="${x.id}" type="button">${x.title}</button>`).join('')}</div><div id="maintenance-panel"></div><div class="dots">${MAINTENANCE.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('')}</div></section>`;const panel=app.querySelector('#maintenance-panel');function select(id){const x=MAINTENANCE.find(m=>m.id===id),idx=MAINTENANCE.indexOf(x);app.querySelectorAll('.maint-tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));app.querySelectorAll('.dots span').forEach((d,i)=>d.classList.toggle('active',i===idx));panel.innerHTML=`<article class="selected-maint ${x.cls}"><div class="selected-art">${x.icon}</div><span class="selected-kicker">MAINTENANCE</span><h2>${x.title}</h2><p>${x.subtitle}</p>${x.url==='#'?`<button class="big-open" data-demo="Bientôt disponible">Bientôt disponible ${arrow()}</button>`:`<a class="big-open" href="${x.url}">Ouvrir la maintenance ${arrow()}</a>`}<div class="direct-link">${x.url==='#'?'Module prévu dans une prochaine version':'↗ Lien direct disponible'}</div></article>`}app.querySelectorAll('.maint-tab').forEach(t=>t.onclick=()=>select(t.dataset.id));select('lit');bind()}
function documentationPage(){app.innerHTML=`${shellTop('Documentation','Retrouvez vos notices, protocoles et documents.')}<section class="documentation-wrap"><div class="doc-card"><div class="doc-art">📄<span>PDF</span></div><span class="selected-kicker">DOCUMENTS EUROMED</span><h2>Documentation EuroMed</h2><p>Accédez à la documentation, aux notices et envoyez vos documents.</p><a class="big-open" href="https://hawaryou.github.io/envoi_pdf_euromed/">Ouvrir la documentation ${arrow()}</a></div><div class="doc-list"><button data-doc="Notices lits médicalisés">🛏️ <b>Notices lits médicalisés</b>${arrow()}</button><button data-doc="Protocoles électriques">⚡ <b>Protocoles électriques</b>${arrow()}</button><button data-doc="Notices matelas à air">💨 <b>Notices matelas à air</b>${arrow()}</button><button data-doc="Protocoles nettoyage">🧼 <b>Protocoles de nettoyage</b>${arrow()}</button><button data-doc="Notices lève-personnes">🏥 <b>Notices lève-personnes</b>${arrow()}</button></div><div class="doc-mascot"><div>Ensemble pour<br><strong>votre matériel !</strong></div><img src="assets/chibi-euromed.png" alt="EuroMed"></div></section>`;bind()}
function interventions(){app.innerHTML=`${shellTop('Mes interventions','Votre activité du jour et les opérations à suivre.')}<section class="stats-strip"><div><b>4</b><small>Aujourd’hui</small></div><div><b>2</b><small>En cours</small></div><div><b>7</b><small>Cette semaine</small></div></section><section class="list-wrap"><div class="list-title">Interventions du jour</div>${[['🛏️','Maintenance lit médicalisé','Client — 09:30','green'],['🚚','Livraison matériel','Établissement — 11:00','blue'],['⚠️','Dépannage fauteuil','Client — 14:00','orange'],['↩️','Reprise matériel','Client — 16:30','purple']].map(x=>`<button class="intervention-card" data-demo="${x[1]}"><span class="list-icon ${x[3]}">${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div><i>›</i></button>`).join('')}</section>`;bind()}
function equipment(){app.innerHTML=`${shellTop('Gestion du matériel','Une vue simple de votre parc et de ses mouvements.')}<section class="equipment-grid"><div class="equipment-stat"><b>128</b><span>Équipements suivis</span></div><div class="equipment-stat"><b>117</b><span>En service</span></div><div class="equipment-stat warn"><b>7</b><span>À contrôler</span></div><div class="equipment-stat danger"><b>4</b><span>En anomalie</span></div></section><section class="list-wrap"><button class="tool-card cyan" data-demo="Recherche par numéro de série"><span>🔎</span><div><b>Rechercher un équipement</b><small>Par numéro de série ou référence</small></div>${arrow()}</button><button class="tool-card orange" data-demo="Entrée de matériel"><span>📥</span><div><b>Entrée de matériel</b><small>Ajouter un équipement au parc</small></div>${arrow()}</button><button class="tool-card purple" data-demo="Transfert de matériel"><span>🔄</span><div><b>Transfert de matériel</b><small>Déplacer un équipement</small></div>${arrow()}</button></section>`;bind()}
function anomaly(){app.innerHTML=`${shellTop('Signaler une anomalie','Créez un rapport rapide avec photo.')}<form class="form-card" id="anomalyForm"><label>Matériel<select><option>Lit médicalisé</option><option>Fauteuil roulant</option><option>Matelas à air</option><option>Lève-personne</option><option>Verticalisateur</option></select></label><label>N° de série<input required placeholder="Ex. EM-123456"></label><label>Type d’anomalie<select><option>Mécanique</option><option>Électrique</option><option>Esthétique</option><option>Accessoire manquant</option><option>Autre</option></select></label><label>Description<textarea required placeholder="Décrivez l’anomalie…"></textarea></label><label class="photo-upload">📷 Ajouter une photo<input id="anomalyPhoto" type="file" accept="image/*" capture="environment"></label><div id="photoPreview" class="photo-preview"></div><button class="big-open" type="submit">Envoyer le rapport ${arrow()}</button></form>`;app.querySelector('#anomalyPhoto').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>app.querySelector('#photoPreview').innerHTML=`<img src="${r.result}" alt="Photo anomalie">`;r.readAsDataURL(f)}};app.querySelector('#anomalyForm').onsubmit=e=>{e.preventDefault();notify('Rapport d’anomalie enregistré pour le test.');showPage('home')};bind()}
function stats(){app.innerHTML=`${shellTop('Mon activité','Un aperçu de vos opérations.')}<section class="profile-hero"><div class="avatar-mini"><img src="assets/chibi-euromed.png"></div><div><b>Technicien EuroMed</b><small>Activité terrain</small></div></section><section class="chart-card"><span class="section-kicker">CE MOIS-CI</span><div class="big-number">24 <small>interventions</small></div><div class="bars">${[45,72,58,88,65,92,76].map((h,i)=>`<span style="height:${h}%"><i>${['L','M','M','J','V','S','D'][i]}</i></span>`).join('')}</div></section><div class="metrics-grid"><div><b>12</b><small>Maintenances</small></div><div><b>8</b><small>Livraisons</small></div><div><b>4</b><small>Reprises</small></div><div><b>3</b><small>Anomalies</small></div></div>`;bind()}
function alerts(){app.innerHTML=`${shellTop('Alertes','Les informations importantes à ne pas manquer.','home','🔔')}<section class="alerts-list"><div class="alert-card danger"><b>🔴 Maintenance à contrôler</b><span>2 équipements nécessitent une vérification.</span></div><div class="alert-card warn"><b>🟠 Maintenance prochaine</b><span>3 équipements arrivent à échéance dans 7 jours.</span></div><div class="alert-card info"><b>🔵 Documentation</b><span>Un nouveau protocole est disponible.</span></div><div class="alert-card success"><b>🟢 Système opérationnel</b><span>Tous les services du Hub sont disponibles.</span></div></section>`;bind()}
function profile(){app.innerHTML=`${shellTop('Mon espace','Votre profil technicien et les réglages du Hub.','home','👨‍🔧')}<section class="profile-card"><div class="profile-avatar"><img src="assets/chibi-euromed.png"></div><h2>Technicien EuroMed</h2><p>Votre matériel médical entre de bonnes mains !</p><div class="profile-stats"><div><b>247</b><span>Interventions</span></div><div><b>128</b><span>Équipements</span></div><div><b>98%</b><span>Suivi</span></div></div></section><section class="list-wrap"><button class="tool-card blue" data-demo="Synchronisation"><span>☁️</span><div><b>Synchronisation</b><small>Dernière mise à jour : aujourd’hui</small></div>${arrow()}</button><button class="tool-card purple" data-demo="Version du Hub : 1.0 test"><span>ℹ️</span><div><b>À propos du Hub</b><small>Version de test — EuroMed</small></div>${arrow()}</button></section>`;bind()}
function scanner(){app.innerHTML=`${shellTop('Scanner universel','Scannez un QR code ou un code-barres pour identifier un équipement.')}<section class="scanner-card"><div class="scanner-frame"><div class="scan-line"></div><span>▣</span></div><b>Scanner un équipement</b><p>Sur iPhone, autorisez la caméra puis placez le code dans le cadre.</p><button class="big-open" id="startScan">📷 Activer le scanner ${arrow()}</button><input id="barcodeFallback" class="scan-input" placeholder="Ou saisir le numéro de série"><button class="secondary-btn" id="simulateScan">Tester avec EM-2026-001</button></section>`;app.querySelector('#startScan').onclick=()=>{if('BarcodeDetector' in window){notify('Scanner caméra disponible. Le support dépend du navigateur.')}else notify('Pour le test, utilisez la saisie manuelle ci-dessous.')};app.querySelector('#simulateScan').onclick=()=>{app.querySelector('#barcodeFallback').value='EM-2026-001';notify('Équipement identifié : EM-2026-001')};bind()}
function interventionWizard(){let step=1;app.innerHTML=`${shellTop('Démarrer une intervention','Parcours guidé du technicien.')}<section class="wizard"><div class="steps"><b class="active">1</b><i></i><b>2</b><i></i><b>3</b><i></i><b>4</b></div><div id="wizardBody"></div></section>`;const body=app.querySelector('#wizardBody');function render(){const views=[`<span class="selected-kicker">ÉTAPE 1</span><h2>Identifier le matériel</h2><p>Commencez par scanner ou saisir le numéro de série.</p><input class="scan-input" id="wizSerial" placeholder="Numéro de série"><button class="big-open" id="next">Continuer ${arrow()}</button>`,`<span class="selected-kicker">ÉTAPE 2</span><h2>Choisir l’intervention</h2><div class="choice-grid"><button data-choice="Maintenance">🛠️ Maintenance</button><button data-choice="Livraison">🚚 Livraison</button><button data-choice="Reprise">↩️ Reprise</button><button data-choice="Dépannage">⚠️ Dépannage</button></div><button class="big-open" id="next">Continuer ${arrow()}</button>`,`<span class="selected-kicker">ÉTAPE 3</span><h2>Contrôler & documenter</h2><textarea class="scan-input area" placeholder="Notes de l’intervention…"></textarea><label class="photo-upload">📷 Ajouter une photo<input type="file" accept="image/*" capture="environment"></label><button class="big-open" id="next">Continuer ${arrow()}</button>`,`<span class="selected-kicker">ÉTAPE 4</span><h2>Terminer l’intervention</h2><p>Signature client et génération du document.</p><div class="signature-box">Signature client</div><button class="big-open" id="finish">✓ Valider l’intervention</button>`];body.innerHTML=views[step-1];app.querySelectorAll('.steps b').forEach((b,i)=>b.classList.toggle('active',i===step-1));const next=body.querySelector('#next');if(next)next.onclick=()=>{step=Math.min(4,step+1);render()};const finish=body.querySelector('#finish');if(finish)finish.onclick=()=>{notify('Intervention de test validée.');showPage('home')};body.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{body.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}render();bind()}
function bind(){app.querySelectorAll('[data-page]').forEach(b=>{if(!b.__bound){b.__bound=true;b.addEventListener('click',e=>{if(b.tagName==='A')return;showPage(b.dataset.page)})}});app.querySelectorAll('[data-maint]').forEach(b=>b.onclick=()=>{const x=MAINTENANCE.find(m=>m.id===b.dataset.maint);if(x.url==='#')notify('Ce module est prévu dans une prochaine version.');else location.href=x.url});app.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>notify(b.dataset.demo+' — fonction de démonstration.'));app.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>notify(b.dataset.doc+' — accès prévu via la documentation EuroMed.'))}
navItems.forEach(n=>n.addEventListener('click',()=>showPage(n.dataset.page)));
home();
</script>
</body>
</html>
